<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/BeefUp/favicon.svg" />
    <link rel="apple-touch-icon" href="/BeefUp/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" />
    <meta name="description" content="Track workouts, macros and progress, online or offline." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BeefUp" />
    <title>BeefUp</title>
    <script>
      // Paint cache only - IndexedDB is the source of truth for these prefs,
      // but it cannot be read synchronously, so the app mirrors theme/accent
      // here on every write and this script replays them before first paint.
      // Without it the page flashes the default theme until hydration lands.
      (function () {
        try {
          var t = localStorage.getItem('paint:theme');
          document.documentElement.setAttribute('data-theme', t ? JSON.parse(t) : 'system');
          var a = localStorage.getItem('paint:accentColor');
          a = a ? JSON.parse(a) : 'green';
          if (a && a !== 'green') document.documentElement.setAttribute('data-accent', a);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'system');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
